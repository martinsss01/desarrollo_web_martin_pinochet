<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividades</title>
    <link rel="stylesheet" th:href="@{/assets/css/styles.css}">
    <html xmlns:th="http://www.thymeleaf.org">
    
</head>
<body>
    <h1 id="first_title"> Actividades </h1>

    <div id="resumen_actividades">
        <table>
            <thead>
                <tr>
                    <th><b>ID</b></th>
                    <th><b>Fecha Inicio</b></th>
                    <th><b>Sector</b></th>
                    <th><b>Nombre</b></th>
                    <th><b>Tema</b></th>                
                    <th><b>Nota</b></th>
                    <th></th>
                </tr>
            </thead>
        <tbody>
            <tr th:each ="actividad : ${data}">
                <td th:text="${actividad.id}"></td>
                <td th:text="${actividad.fecha_inicio}"></td>
                <td th:text="${actividad.sector}"></td>
                <td th:text="${actividad.nombre}"></td>
                <td th:text="${actividad.tema}"></td>
                <td th:text="${actividad.nota}"></td>
                <td>
                    <button type="button" onclick="evaluar('${actividad.id}')">Evaluar</button>
                </td>
            </tr>
        </tbody>
    </div>
</table>
<script>
function evaluar(actividadId) {
  let nota = prompt("Por favor ingresa una nota (1-7):");
  if (nota === null) {
    return;
  }

  nota = parseInt(nota, 10);

  if (isNaN(nota) || nota < 1 || nota > 7) {
    alert("Por favor ingresa un número válido entre 1 y 7.");
    return;
  }

  // Send to backend via fetch
  fetch('/post_nota', {
    method: 'POST',
    body: new URLSearchParams({
      actividadId: actividadId,
      nota: nota
    })
  })
  .then(response => {
    if (response.ok) {
      alert("Nota guardada correctamente.");
      window.location.reload();
    } else {
      alert("Error al guardar la nota.");
    }
  })
  .catch(error => {
    console.error("Error:", error);
    alert("Error de red al guardar la nota.");
  });
}
</script>

</body>

</html>
